<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בדיקת קולות - כסף חכם</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding: 0; }
    .wrap { width: min(760px, 100%); margin: 0 auto; padding: 28px 18px 60px; }
    .verdict { padding: 20px 24px; border-radius: 18px; margin: 18px 0; font-size: 1.05rem; }
    .verdict.good { background: var(--brand-soft); border: 2px solid var(--brand); }
    .verdict.warn { background: var(--accent-soft); border: 2px solid var(--accent); }
    .verdict.bad  { background: var(--danger-soft); border: 2px solid var(--danger); }
    .verdict h2 { margin-top: 0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           flex-wrap: wrap; padding: 12px 16px; border: 1px solid var(--line);
           border-radius: 14px; background: var(--surface); margin-bottom: 8px; }
    .row code { font-size: 0.82rem; color: var(--ink-soft); direction: ltr; }
    .row.pick { border-color: var(--brand); background: var(--brand-soft); }
    .badge { font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px;
             background: var(--brand); color: #fff; }
    pre { background: #f2f5fa; border: 1px solid var(--line); border-radius: 12px;
          padding: 14px; overflow-x: auto; font-size: 0.8rem; direction: ltr; text-align: left; }
    .copy-area { margin-top: 26px; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="eyebrow">כלי בדיקה</span>
    <h1>אילו קולות יש לדפדפן שלך?</h1>
    <p>הדף הזה בודק מה הדפדפן הזה מסוגל לעשות. פתחו אותו גם בכרום וגם ב-Edge והשוו.</p>

    <div id="verdict" class="verdict warn">
      <h2>⏳ בודק...</h2>
      <p>רגע אחד, הדפדפן טוען את רשימת הקולות.</p>
    </div>

    <h2>הקולות בעברית שנמצאו</h2>
    <div id="hebrewList"></div>

    <h2>כל הקולות במחשב</h2>
    <div id="allList"></div>

    <div class="copy-area">
      <h2>מידע לשליחה</h2>
      <p>אם משהו לא עובד, העתיקו את הטקסט הזה ושלחו אותו:</p>
      <pre id="report"></pre>
      <button class="primary-button" onclick="copyReport()">📋 העתקת המידע</button>
    </div>
  </div>

  <script>
    function browserName() {
      const ua = navigator.userAgent;
      if (/Edg\//.test(ua)) return "Microsoft Edge";
      if (/OPR\//.test(ua)) return "Opera";
      if (/Firefox\//.test(ua)) return "Firefox";
      if (/Chrome\//.test(ua)) return "Google Chrome";
      if (/Safari\//.test(ua)) return "Safari";
      return "לא מזוהה";
    }

    function rankVoice(voice) {
      let score = 0;
      const name = voice.name.toLowerCase();
      if (/^(he|iw)/i.test(voice.lang)) score += 100;
      if (/google/.test(name)) score += 30;
      if (/natural|neural|online/.test(name)) score += 25;
      if (!voice.localService) score += 10;
      return score;
    }

    function speak(voice) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("שלום, אני הקול שילמד אתכם על כסף.");
      u.voice = voice;
      u.lang = voice.lang;
      speechSynthesis.speak(u);
    }

    function makeRow(voice, label) {
      const row = document.createElement("div");
      row.className = "row" + (label ? " pick" : "");

      const left = document.createElement("div");
      left.innerHTML =
        (label ? '<span class="badge">' + label + "</span> " : "") +
        "<strong>" + voice.name + "</strong><br><code>" + voice.lang +
        (voice.localService ? " · מותקן במחשב" : " · מהאינטרנט") + "</code>";

      const button = document.createElement("button");
      button.className = "back-button";
      button.textContent = "🔊 השמעה";
      button.onclick = () => speak(voice);

      row.appendChild(left);
      row.appendChild(button);
      return row;
    }

    function render() {
      const all = speechSynthesis.getVoices();
      if (!all.length) return false;

      const hebrew = all
        .filter(v => /^(he|iw)/i.test(v.lang))
        .sort((a, b) => rankVoice(b) - rankVoice(a));

      const male = hebrew.find(v => /avri|asaf/i.test(v.name));
      const female = hebrew.find(v => /hila|carmit/i.test(v.name));
      let owl = male || hebrew[0];
      let mobi = female || hebrew.find(v => v !== owl) || hebrew[0];
      if (owl === mobi && hebrew.length >= 2) mobi = hebrew.find(v => v !== owl);

      const verdict = document.getElementById("verdict");

      if (!hebrew.length) {
        verdict.className = "verdict bad";
        verdict.innerHTML =
          "<h2>❌ אין קול בעברית</h2><p>הדפדפן הזה (" + browserName() +
          ") לא מצא אף קול עברי במחשב. השיעורים ירוצו עם כתוביות בלבד.</p>";
      } else if (hebrew.length === 1) {
        verdict.className = "verdict warn";
        verdict.innerHTML =
          "<h2>⚠️ יש קול עברי אחד בלבד</h2><p>ב-" + browserName() +
          " נמצא רק <strong>" + hebrew[0].name +
          "</strong>. השיעורים ידברו, אבל שתי הדמויות יקבלו את אותו קול עם גובה צליל שונה.</p>" +
          "<p>נסו לפתוח את הדף הזה ב-<strong>Microsoft Edge</strong> - שם לרוב יש קולות נוספים.</p>";
      } else {
        verdict.className = "verdict good";
        verdict.innerHTML =
          "<h2>✅ מצוין! יש " + hebrew.length + " קולות בעברית</h2>" +
          "<p>ב-" + browserName() + " לכל דמות יהיה קול אמיתי משלה:</p>" +
          "<p>🦉 <strong>ינשוף</strong> — " + owl.name + "<br>🐭 <strong>מובי</strong> — " + mobi.name + "</p>";
      }

      const hebrewList = document.getElementById("hebrewList");
      hebrewList.innerHTML = "";
      if (!hebrew.length) {
        hebrewList.innerHTML = '<div class="empty-state">לא נמצאו קולות בעברית.</div>';
      } else {
        hebrew.forEach(v => {
          const label = v === owl ? "ינשוף" : v === mobi ? "מובי" : "";
          hebrewList.appendChild(makeRow(v, label));
        });
      }

      const allList = document.getElementById("allList");
      allList.innerHTML = "";
      all.forEach(v => allList.appendChild(makeRow(v, "")));

      document.getElementById("report").textContent = JSON.stringify({
        browser: browserName(),
        userAgent: navigator.userAgent,
        totalVoices: all.length,
        hebrewVoices: hebrew.map(v => v.name + " | " + v.lang + " | local:" + v.localService),
        pickedOwl: owl ? owl.name : null,
        pickedMobi: mobi ? mobi.name : null
      }, null, 2);

      return true;
    }

    function copyReport() {
      navigator.clipboard.writeText(document.getElementById("report").textContent)
        .then(() => alert("הועתק! אפשר להדביק ולשלוח."))
        .catch(() => alert("ההעתקה נכשלה. סמנו את הטקסט ידנית."));
    }

    speechSynthesis.onvoiceschanged = render;
    let tries = 0;
    const timer = setInterval(() => {
      if (render() || tries++ > 24) clearInterval(timer);
    }, 250);
    render();
  </script>
</body>
</html>
